- id: collins-1989-cognitive-apprenticeship
  title: "Cognitive Apprenticeship: Teaching the Crafts of Reading, Writing, and Mathematics"
  authors: [Allan Collins, John Seely Brown, Susan E. Newman]
  kind: book_chapter
  year: 1989
  venue: "In L. B. Resnick (Ed.), Knowing, Learning, and Instruction: Essays in Honor of Robert Glaser. Lawrence Erlbaum Associates."
