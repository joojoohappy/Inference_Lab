  beginner:
    en: "Learning a craft by watching an expert, trying with help, then doing it alone, with the expert's thinking made visible. Inference Lab's Observe, Guided and Expert modes follow this idea."
    zh-TW: "學一門手藝的方式：先看專家做，再在協助下嘗試，最後自己完成，過程中讓專家的思考變得看得見。Inference Lab 的觀察、引導與專家三種模式就是依循這個概念。"
  engineering:
