    zh-TW: "模型資訊包含 sha（版本）、siblings（檔案清單，加上 blobs=true 時含大小）、safetensors 參數量、gated 狀態與 cardData。"
  contributions:
    en: "Programmatic access to the same metadata as the website."
    zh-TW: "以程式存取和網站相同的中繼資料。"
  practical:
    en: "See inference_lab/hub.py: inspect_model and summarize."
    zh-TW: "請看 inference_lab/hub.py：inspect_model 與 summarize。"
  limitations:
    en: "Field availability varies per repo (e.g. parameter counts only for safetensors repos)."
    zh-TW: "可用的欄位因 repo 而異（例如只有 safetensors repo 才有參數量）。"

- id: safetensors-docs
  title: "Safetensors documentation"
  authors: [Hugging Face]
  kind: documentation
  url: https://huggingface.co/docs/safetensors/index
  concepts: [safetensors]
  related_missions: [m02-find-your-model]
