[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-lab"
version = "0.1.0"
description = "Inference Lab: an interactive AI inference engineering workbench. Learn it. Run it. Understand it. Improve it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6",
  "psutil>=5.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Real local inference with Hugging Face Transformers (CPU works; GPU optional).
inference = ["torch>=2.2", "transformers>=4.40", "tokenizers>=0.15", "safetensors>=0.4"]
dev = ["pytest>=8", "httpx>=0.27"]
# Optional AI tutor provider (the lab works fully without it).
tutor = ["anthropic>=0.70"]

[project.scripts]
inference-lab = "inference_lab.cli:main"

[tool.setuptools.packages.find]
include = ["inference_lab*"]

[tool.setuptools.package-data]
inference_lab = ["missions/data/*.yaml", "tutor/knowledge/*.yaml", "research/*.yaml", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "inference: needs torch + transformers installed (CPU is enough)",
  "gpu: needs an NVIDIA GPU; reported as NOT RUN when absent",
]
